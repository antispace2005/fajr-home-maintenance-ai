services:
  postgres:
    image: postgres:16
    container_name: home_maintenance_pg
    environment:
      POSTGRES_DB: home_maintenance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d home_maintenance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: home_maintenance_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/home_maintenance_db
      - JWT_SECRET=supersecretjwtkey_fajr_maintenance_2026
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
